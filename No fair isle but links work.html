
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fair Isle</title>

<style>
:root {
  --dark: #493629;
  --brown: #765640;
  --tan: #b89a77;
  --cream: #eee3d0;
  --stitch: #d5b88d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--dark);
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 22px;
}

.frame {
  width: 100%;
  min-height: 100vh;
  box-sizing: border-box;
  padding: 35px;
  background: #493629;
}

.inner-frame {
  width: 100%;
  min-height: calc(100vh - 70px);
  box-sizing: border-box;
  padding: 20px;
  background: #765640;
}


.content {
  width: 100%;
  min-height: calc(100vh - 110px);
  box-sizing: border-box;

  background: #eee3d0;
  border: 3px solid #b89a77;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 48px;
  text-align: center;
  padding: 30px;
  margin: 0;
}


@media (max-width: 600px) {
  .frame {
    padding: 15px;
  }

  .inner-frame {
    padding: 10px;
  }

  .content {
    min-height: calc(100vh - 50px);
    padding: 15px;
    gap: 30px;
  }
}

.content h1 {
  color: #765640;
  font-family: Georgia, serif;
  font-size: clamp(60px, 5vw, 56px);
  font-weight: bold;
  margin: 0;
  letter-spacing: 1px;
}


.chair-wrapper {
  position: relative;
  display: inline-block;
  margin-top: 10px;
}


.chair-wrapper {
  position: relative;
  display: inline-block;
  margin-top: 10px;
}

.sparkle {
  position: absolute;
  color: #b88958;
  pointer-events: none;
  animation: twinkle 1.8s ease-in-out infinite;
}

.sparkle.main {
  font-size: 27px;
}

.sparkle.small {
  font-size: 13px;
  color: #d5b88d;
  animation-duration: 2.4s;
}

.chair-wrapper {
  position: relative;
  display: inline-block;
  width: 200px;
  height: 230px;
}

.chair-wrapper svg {
  display: block;
}

@keyframes pixel-twinkle {
  0%, 100% {
    opacity: 0.3;
    transform: scale(0.8);
  }
  50% {
    opacity: 1;
    transform: scale(1.15);
  }
}

@keyframes twinkle {
  0%, 100% {
    opacity: 0.2;
    transform: scale(0.7) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.2) rotate(45deg);
  }
}


.sparkle {
  position: absolute;
  pointer-events: none;
  color: #b88958;
  font-family: monospace;
  line-height: 1;
  animation: pixel-twinkle 1.8s steps(3, end) infinite;
}

.sparkle.main {
  font-size: 27px;
}

.sparkle.small {
  font-size: 15px;
  color: #d5b88d;
  animation-duration: 2.4s;
}

.sparkle.top-left {
  top: -10px;
  left: 30px;
}

.sparkle.tiny-one {
  top: 10px;
  left: 25px;
  animation-delay: 0.5s;
}

.sparkle.bottom-right {
  bottom: 8px;
  right: 18px;
}

.sparkle.tiny-two {
  bottom: 25px;
  right: 13px;
  animation-delay: 0.8s;
}



/* Responsive spacing */
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .frame {
    padding: 9px;
  }

  .inner-frame {
    padding: 8px;
  }

  .content {
    min-height: calc(100vh - 70px);
  }
}


.content h1 a {
  color: #765640;
  text-decoration: none;
  font-weight: bold;
}

.content h1 a:hover {
  text-decoration: underline;
}

.chair-link {
  display: inline-block;
  text-decoration: none;
  cursor: pointer;
}

.chair-link svg {
  display: block;
}

.chair-link:hover {
  cursor: pointer;
}

</style>
</head>

<body>
  <main class="frame">
    <div class="inner-frame">
      
	<section class="content">

  		<h1>
  			<a href="https://durhack-2026.github.io/LogicalSexualSalamander/">
    		Room For Improvement
  			</a>
		</h1>

		<div class="chair-wrapper">

  			<!-- Top-left pair -->
  			<span class="sparkle main top-left">✦</span>
  			<span class="sparkle small tiny-one">✧</span>

  			<!-- Bottom-right pair -->
  			<span class="sparkle main bottom-right">✦</span>
  			<span class="sparkle small tiny-two">✧</span>

  			<a href="https://www.youtube.com/watch?v=Ew7Zkkucos8"
   				class="chair-link"
   				aria-label="">


			<svg width="200" height="240" viewBox="0 0 200 230"
       				xmlns="http://www.w3.org/2000/svg"
				shape-rendering="crispEdges">

   			<!-- Chair back -->
   		 	<rect x="48" y="8" width="104" height="96"
          			fill="#493629"/>

    			<rect x="56" y="16" width="88" height="80"
          			fill="#765640"/>
			<rect x="64" y="24" width="72" height="64"
				fill="#b88958"/>

			<!-- Backrest wooden slats -->
  			<rect x="72" y="32" width="12" height="48" fill="#765640"/>
  			<rect x="94" y="32" width="12" height="48" fill="#765640"/>
  			<rect x="116" y="32" width="12" height="48" fill="#765640"/>

  			<!-- Top detail -->
  			<rect x="80" y="24" width="40" height="8" fill="#d5b88d"/>

  			<!-- Seat -->
  			<rect x="32" y="104" width="136" height="32" fill="#493629"/>
  			<rect x="40" y="104" width="120" height="24" fill="#b88958"/>
  			<rect x="48" y="112" width="104" height="8" fill="#d5b88d"/>

  			<!-- Legs -->
  			<rect x="48" y="136" width="16" height="72" fill="#765640"/>
  			<rect x="136" y="136" width="16" height="72" fill="#765640"/>
	
  			<!-- Leg highlights -->
 			<rect x="48" y="144" width="6" height="56" fill="#b88958"/>
  			<rect x="136" y="144" width="6" height="56" fill="#b88958"/>

  			<!-- Cross support -->
 			<rect x="56" y="168" width="88" height="12" fill="#493629"/>
  			<rect x="64" y="168" width="72" height="4" fill="#b88958"/>

  			<!-- Feet -->
  			<rect x="40" y="208" width="32" height="8" fill="#493629"/>
  			<rect x="128" y="208" width="32" height="8" fill="#493629"/>
    		

		</div>  
	</svg>
	</a>
      </section>
    </div>
  </main>
</body>
</html>
